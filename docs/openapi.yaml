      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Amount:
      type: string
      pattern: ^(0|[1-9][0-9]{0,14})\.[0-9]{2}$
      examples:
        - '1000000.00'
      description: Десятичное значение в рублях, ровно два знака после точки.
    ApplicationStatus:
      type: string
      enum:
        - Draft
        - Submitted
        - Checking
        - NeedsInfo
        - Scoring
        - ManualReview
        - Offered
        - Rejected
        - Accepted
        - Declined
        - Signed
        - Disbursed
    ApplicationAction:
      type: string
      enum:
        - edit
        - upload_document
        - delete_document
        - submit
        - answer_information_request
        - accept_offer
        - decline_offer
        - sign
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
      required:
        - message
    Error:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      description: Единый формат ошибок, включая ошибки валидации.
      required:
        - message
        - details
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true
      required:
        - login
        - password
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: Непрозрачный секрет сессии, выданный при входе или последнем обновлении.
      required:
        - refresh_token
    TokenResponse:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 1
          description: JWT для защищённых операций API; содержит идентификатор сессии sid.
        refresh_token:
          type: string
          minLength: 1
          description: Одноразовый непрозрачный токен обновления. После ротации заменяется новым.
      required:
        - access_token
        - refresh_token
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          type: string
          enum:
            - client
            - bank_employee
      required:
        - id
        - display_name
        - role
    Membership:
      type: object
      additionalProperties: false
      properties:
        company_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - owner
            - representative
      required:
        - company_id
        - role
    CurrentUser:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      required:
        - user
        - memberships
    CompanyCreate:
      type: object
      additionalProperties: false
      properties:
        legal_type:
          type: string
          enum:
            - legal_entity
            - individual_entrepreneur
        inn:
          type: string
          pattern: ^([0-9]{10}|[0-9]{12})$
        name:
          type: string
          minLength: 1
          maxLength: 500
        registration_date:
          type: string
          format: date
        okved:
          type: string
          minLength: 2
          maxLength: 16
        address:
          type: string
          minLength: 1
          maxLength: 1000
      required:
        - legal_type
        - inn
        - name
        - registration_date
        - okved
        - address
    CompanyUpdate:
      type: object
      additionalProperties: false
      properties:
        expected_version:
          type: integer
          minimum: 1
          description: Версия агрегата. Увеличивается при каждом изменении, включая действия worker.
        legal_type:
          type: string
          enum:
            - legal_entity
            - individual_entrepreneur
        name:
          type: string
          minLength: 1
          maxLength: 500
        registration_date:
          type: string
          format: date
        okved:
          type: string
          minLength: 2
          maxLength: 16
        address:
          type: string
          minLength: 1
          maxLength: 1000
      description: 'PATCH: отсутствующие поля сохраняются, null не принимается. ИНН после создания неизменяем.'
      minProperties: 2
      required:
        - expected_version
    Company:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Версия агрегата. Увеличивается при каждом изменении, включая действия worker.
        legal_type:
