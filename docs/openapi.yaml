openapi: 3.1.0
info:
  title: Кредитный кабинет предпринимателя - Backend API
  version: 0.2.0
  description: |-
    HTTP-контракт кредитного кабинета. Стек, обработка заявок, устройство сессий и локальных заглушек описаны в [ARCHITECTURE.md](ARCHITECTURE.md).

    Все идентификаторы - UUID, время - UTC в формате RFC 3339, деньги - десятичные строки RUB. Необязательные поля ответа отсутствуют, если значения нет; null не используется. Списки сортируются по created_at DESC, id DESC (продукты - по code ASC, id ASC). При параллельных изменениях offset-пагинация не обеспечивает снимок списка.

    Клиентские операции доступны роли client; /bank/* - bank_employee. GET /products, /products/{product_id}, /auth/me доступны обеим ролям. Клиент видит только компании своего членства и их заявки/документы.

    Каждая мутация существующей заявки принимает expected_version. Несовпадение возвращает 409. В ответах команд возвращается состояние на момент фиксации, worker может сразу его изменить. Изменения данных, документов и уточнений увеличивают версию заявки.

    Ответы всех auth-операций имеют Cache-Control: no-store.

    Матрица переходов, технические статусы и внутренние контракты заглушек зафиксированы в [BACKEND_RULES.md](BACKEND_RULES.md). Продукт можно установить или изменить только в Draft; после подачи он неизменяем. Документы загружаются и удаляются только в Draft/NeedsInfo, удаление запрещено для документов любого снимка. Сотрудник банка не имеет доступа к черновикам, включая скачивание их документов.
servers:
  - url: http://localhost:8000/api/v1
    description: Локальная разработка; адрес и порт предварительные.
tags:
  - name: Auth
    description: Аутентификация
  - name: Companies
    description: Компании клиента
  - name: Products
    description: Кредитные продукты
  - name: Applications
    description: Заявки клиента
  - name: Documents
    description: Документы заявки
  - name: Information
    description: Уточнение данных
  - name: Offers
    description: Предложения условий
  - name: Bank
    description: Рабочее место сотрудника банка
  - name: Health
    description: Работоспособность
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
        - Auth
      operationId: login
      summary: Вход
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              login: login
              password: password
  /auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshTokens
      summary: Обновить токены с ротацией refresh token
      description: |-
        Погашает переданный refresh token и создаёт новый. История хешей погашенных
        токенов сохраняется до истечения сессии для обнаружения повторного использования.
        Повторное использование отзывает всю сессию, включая уже выданные новые токены, и возвращает 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refresh_token: refresh-token
      responses:
        '200':
          description: Новая пара токенов.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          description: Токен недействителен, истёк или повторно использован.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid:
                  value:
                    message: Refresh token недействителен или истёк.
                    details: []
                reused:
                  value:
                    message: Повторное использование refresh token.
                    details: []
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: Отозвать сессию и токены
      description: Отзывает сессию переданного refresh token и все её токены, включая access JWT; другие сессии пользователя остаются активными.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refresh_token: refresh-token
      responses:
        '204':
          description: Сессия отозвана или недействительна.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: Текущий пользователь и членство
      responses:
        '200':
          description: Операция выполнена.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/AuthUnauthorized'
        '503':
          $ref: '#/components/responses/AuthUnavailable'
  /products:
    get:
      tags:
        - Products
      operationId: listProducts
      summary: Получить активные продукты
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
  /products/{product_id}:
    get:
      tags:
        - Products
      operationId: getProduct
      summary: Информация о продукте
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
        - $ref: '#/components/parameters/product_id'
  /companies:
    get:
      tags:
        - Companies
      operationId: listCompanies
      summary: Получить доступные компании
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
        - Companies
      operationId: createCompany
      summary: Создать компанию
      responses:
        '201':
          description: Ресурс создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Создатель становится owner. ИНН уникален; для ИП 12 цифр, для юридического лица 10.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
            example:
              legal_type: legal_entity
              inn: '0000000000'
              name: ООО Компания
              registration_date: '2020-01-15'
              okved: '47.91'
              address: Город А, Улица Б, д. 6, к. 7
  /companies/{company_id}:
    get:
      tags:
        - Companies
      operationId: getCompany
      summary: Получить профиль компании
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
        - $ref: '#/components/parameters/company_id'
    patch:
      tags:
        - Companies
      operationId: updateCompany
      summary: Изменить профиль компании
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Только owner.
      parameters:
        - $ref: '#/components/parameters/company_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
            example:
              expected_version: 1
              legal_type: legal_entity
              name: ООО Компания
              registration_date: '2020-01-15'
              okved: '47.91'
              address: Город А, Улица Б, д. 6, к. 7
  /applications:
    get:
      tags:
        - Applications
      operationId: listApplications
      summary: Получить заявки доступных компаний
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: company_id
          in: query
          schema:
            type: string
            format: uuid
          example: 11111111-1111-4111-8111-111111111111
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
          example: Draft
    post:
      tags:
        - Applications
      operationId: createApplication
      summary: Создать черновик
      responses:
        '201':
          description: Ресурс создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationCreate'
            example:
              company_id: 11111111-1111-4111-8111-111111111111
              data:
                product_id: 22222222-2222-4222-8222-222222222222
                amount: '1200000.00'
                term_months: 18
                purpose: Закупка товарных запасов и пополнение оборотных средств интернет-магазина
                financials:
                  as_of_date: '2026-10-01'
                  monthly_revenue: '1500000.00'
                  monthly_expenses: '900000.00'
                  outstanding_debt: '500000.00'
                  monthly_debt_payments: '50000.00'
  /applications/{application_id}:
    get:
      tags:
        - Applications
      operationId: getApplication
      summary: Получить состояние заявки
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
        - $ref: '#/components/parameters/application_id'
    patch:
      tags:
        - Applications
      operationId: updateApplication
      summary: Изменить данные черновика
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
        - $ref: '#/components/parameters/application_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUpdate'
            example:
              expected_version: 1
              data:
                amount: '1200000.00'
                term_months: 18
                purpose: Закупка товарных запасов и пополнение оборотных средств интернет-магазина
                financials:
                  as_of_date: '2026-10-01'
                  monthly_revenue: '1500000.00'
                  monthly_expenses: '900000.00'
                  outstanding_debt: '500000.00'
                  monthly_debt_payments: '50000.00'
  /applications/{application_id}/submit:
    post:
      tags:
        - Applications
      operationId: submitApplication
      summary: Подать заявку
      responses:
        '202':
          description: Команда принята; состояние может измениться фоновым обработчиком.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Проверяет данные, документы и продукт; создаёт снимок, событие и задание, переводит в Submitted.
        Фиксируется подтверждение согласий.
      parameters:
        - $ref: '#/components/parameters/application_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            example:
              expected_version: 3
              consents:
                credit_history: true
                data_processing: true
  /applications/{application_id}/events:
    get:
      tags:
        - Applications
      operationId: listApplicationEvents
      summary: История заявки
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
        - $ref: '#/components/parameters/application_id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
  /applications/{application_id}/sign:
    post:
      tags:
        - Applications
      operationId: signApplication
      summary: Имитация подписания заявки представителем компании
      description: Только Accepted. Атомарно переводит заявку в Signed и создаёт задание имитации выдачи; worker переводит в Disbursed. Повторная команда возвращает 409.
      responses:
        '202':
          description: Команда принята; состояние может измениться фоновым обработчиком.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
        - $ref: '#/components/parameters/application_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
            example:
              expected_version: 13
  /applications/{application_id}/documents:
    get:
      tags:
        - Documents
      operationId: listDocuments
      summary: Получить документы заявки
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
        - $ref: '#/components/parameters/application_id'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
    post:
      tags:
        - Documents
      operationId: uploadDocument
      summary: Загрузить документ
      responses:
        '201':
          description: Ресурс создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentMutation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Только Draft или NeedsInfo. Не более 10 MiB; application/pdf, image/jpeg, image/png. Версия и состояние повторно проверяются после загрузки в S3, перед фиксацией метаданных. Дубликаты типов документов допустимы; снимок содержит явно выбранные документы.
      parameters:
        - $ref: '#/components/parameters/application_id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
            example:
              expected_version: 2
              document_type: financial_statement
              file: <binary contents of financial-statement-2026-09.pdf>
  /applications/{application_id}/documents/{document_id}:
    delete:
      tags:
        - Documents
      operationId: deleteDocument
      summary: Удалить документ
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Только Draft или NeedsInfo. Документ, включённый хотя бы в один снимок, удалять нельзя. Несовпадение версии или запрет по состоянию/снимку возвращает 409.
      parameters:
        - $ref: '#/components/parameters/application_id'
        - $ref: '#/components/parameters/document_id'
        - name: expected_version
          in: query
          schema:
            type: integer
            minimum: 1
          required: true
          example: 3
  /applications/{application_id}/documents/{document_id}/content:
    get:
      tags:
        - Documents
      operationId: downloadDocument
      summary: Скачать документ
      responses:
        '200':
          description: Операция выполнена.
          headers:
            Content-Disposition:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Доступ клиенту компании и сотруднику банка после подачи заявки. Для Draft доступ имеет только клиент компании. Сотруднику банка для Draft возвращается 404. Имя файла передаётся в Content-Disposition.
      parameters:
        - $ref: '#/components/parameters/application_id'
        - $ref: '#/components/parameters/document_id'
  /applications/{application_id}/information-requests:
    get:
      tags:
        - Information
      operationId: listInformationRequests
