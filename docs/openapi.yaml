      description: Только processing.status=blocked и retry_available=true в Checking, Scoring или Signed, без активного задания. Создаёт задание для незавершённого шага текущего снимка, без изменения бизнес-статуса. Для Signed возобновляет имитацию выдачи. Успешные шаги не пересчитываются; Rejected, Declined и Disbursed не перезапускаются. Гонка с worker или повтор команды возвращает 409.
