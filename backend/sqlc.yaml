version: "2"

plugins:
  - name: py
    wasm:
      url: https://downloads.sqlc.dev/plugin/sqlc-gen-python_1.3.0.wasm
      sha256: fbedae96b5ecae2380a70fb5b925fd4bff58a6cfb1f3140375d098fbab7b3a3c

sql:
  - engine: postgresql
    schema: db/migrations/app/0001_core.sql
    queries: db/queries/repository.sql
    codegen:
      - plugin: py
        out: src/generated/creditdb
        options:
          package: creditdb
          emit_async_querier: true
          emit_sync_querier: false
  - engine: postgresql
    schema: db/migrations/0001_stack_check.sql
    queries: db/queries/stack_check.sql
    codegen:
      - plugin: py
        out: src/generated/stack_check
        options:
          package: stack_check
          emit_async_querier: true
          emit_sync_querier: false
