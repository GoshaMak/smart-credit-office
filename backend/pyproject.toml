[project]
name = "credit-backend"
version = "0.1.0"
description = "Backend for the synthetic small-business credit application workflow"
requires-python = ">=3.14,<3.15"
dependencies = [
    "anyio==4.15.1",
    "boto3==1.43.118",
    "fastapi==0.162.0",
    "jsonschema==4.26.0",
    "psycopg[binary]==3.3.6",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "sqlalchemy==2.0.54",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "openapi-spec-validator==0.9.0",
    "PyYAML==6.0.3",
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["src", "src/generated"]

[tool.hatch.build.targets.wheel]
packages = ["src/credit", "src/generated/creditdb", "src/generated/stack_check"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "src/generated", ".."]
markers = ["integration: requires isolated PostgreSQL and LocalStack test services"]
