[project]
name = "credit-backend"
version = "0.1.0"
description = "Credit application backend technical spike and shared development tooling"
requires-python = ">=3.14,<3.15"
dependencies = [
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.0.54",
]

[dependency-groups]
dev = [
    "openapi-spec-validator==0.9.0",
    "PyYAML==6.0.3",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src/generated"]
