services:
  postgres:
    image: postgres:16.15@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_DB: stack_check
      POSTGRES_USER: stack_check
      POSTGRES_PASSWORD: stack-check-local-only
    ports:
      - "127.0.0.1:55439:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=256m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stack_check -d stack_check"]
      interval: 1s
      timeout: 3s
      retries: 30
